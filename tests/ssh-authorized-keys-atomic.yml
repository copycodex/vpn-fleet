---
- name: Exercise atomic authorized key replacement with synthetic inputs
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: /usr/local/bin/python
    ssh_authorized_keys_user: keytest
    ssh_authorized_keys_devops:
      - name: synthetic-admin-one
        pubkey: "{{ lookup('ansible.builtin.file', '/tmp/vpn-fleet-authorized-keys/new-one.pub') }}"
      - name: synthetic-admin-two
        pubkey: "{{ lookup('ansible.builtin.file', '/tmp/vpn-fleet-authorized-keys/new-two.pub') }}"
    ssh_authorized_keys_node_extra: []
    ssh_authorized_keys_exclusive: true
  roles:
    - ssh_authorized_keys
