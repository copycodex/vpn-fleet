[defaults]
inventory = private/inventories
roles_path = roles
vars_plugins_enabled = host_group_vars, community.sops.sops
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
gathering = smart
timeout = 30
forks = 10
nocows = True

[ssh_connection]
pipelining = True
# При потерях пакетов SSH-соединения могут зависать или не устанавливаться.
# Повторы позволяют Ansible пройти временные сбои сети.
retries = 6
# ServerAlive* ограничивает молчание после установки соединения: timeout
# покрывает только само соединение. Иначе зависший канал мультиплексора может
# оставить Ansible на Gathering Facts без сообщения об ошибке.
# ServerAliveInterval=5 × ServerAliveCountMax=3 обрывают зависший сеанс
# примерно через 15 секунд молчания; Ansible сообщает UNREACHABLE.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o UserKnownHostsFile=private/inventories/known_hosts -o StrictHostKeyChecking=yes -o ServerAliveInterval=5 -o ServerAliveCountMax=3

[inventory]
# Node skeletons live next to active inventories but must never become hosts.
#
# first-entry.sops.yml лежит в каталоге инвентаря, но инвентарём не является:
# это карта первого входа, которую читает make first-contact. Без этой строки
# yaml-плагин разбирает его как источник и выдумывает группы first_entry и
# sops.
ignore_patterns = .*\.template$, known_hosts, first-entry.sops.yml

# [community.sops] здесь намеренно пуст: путь к age-ключу не константа. Ключ
# зовётся по имени установки и выбирается правилом Makefile
# (FLEET=<имя>, иначе единственный ключ в ~/.config/sops/age). Makefile
# экспортирует ANSIBLE_SOPS_AGE_KEYFILE и SOPS_AGE_KEY_FILE, поэтому все
# make-цели расшифровывают инвентарь без настройки здесь.
#
# Кто зовёт ansible-playbook напрямую, мимо make, обязан экспортировать их сам:
#   export ANSIBLE_SOPS_AGE_KEYFILE=~/.config/sops/age/<имя>.txt
# Иначе sops возьмёт ключ, который рабочая станция экспортировала для другого
# проекта, и прогон упадёт на "no identity matched any of the recipients".
