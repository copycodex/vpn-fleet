name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: python:3.14.2-slim-bookworm
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
      ANSIBLE_INVENTORY: ${{ github.workspace }}/tests/inventory
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Install system tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends age ca-certificates curl git haproxy jq make openssh-client openssl systemd unzip uuid-runtime
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -r requirements-ci.txt
          curl -fsSL --retry 5 -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64
          echo 'cd795109851c3a483bbaa66d15d19ddb2227ac0352b39e25d96b67d51edb6225  /tmp/sops' | sha256sum -c -
          install -m 0755 /tmp/sops /usr/local/bin/sops
          shellcheck_version=v0.11.0
          curl -fsSL --retry 5 -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_version}/shellcheck-${shellcheck_version}.linux.x86_64.tar.xz"
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz' | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-${shellcheck_version}/shellcheck" /usr/local/bin/shellcheck
      - name: Shell lint
        run: |
          set -euo pipefail
          files="$(mktemp)"
          trap 'rm -f "$files"' EXIT
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 > "$files"
          if [ ! -s "$files" ]; then
            echo 'No shell scripts found' >&2
            exit 1
          fi
          xargs -0 shellcheck < "$files"
      - name: Ansible and YAML lint
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r requirements.yml -p .ansible/collections
          yamllint .
          ansible-lint
          for playbook in playbooks/*.yml; do
            ansible-playbook -i tests/inventory --syntax-check "$playbook"
          done
      - name: Download checked render binaries
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import shlex
          import yaml
          defaults = yaml.safe_load(open('roles/singbox/defaults/main.yml'))
          ci = yaml.safe_load(open('tests/inventory/nodes/ci.yml'))
          values = {
              'SINGBOX_VERSION': defaults['singbox_version'],
              'SINGBOX_LEGACY_VERSION': defaults['singbox_legacy_test_version'],
              'XRAY_VERSION': ci['all']['hosts']['ci']['xray_version'],
              'XRAY_ASSET': defaults['xray_arch_assets']['amd64'],
          }
          values['SINGBOX_SHA256'] = defaults['singbox_checksums'][values['SINGBOX_VERSION']]['amd64'].removeprefix('sha256:')
          values['SINGBOX_LEGACY_SHA256'] = defaults['singbox_checksums'][values['SINGBOX_LEGACY_VERSION']]['amd64'].removeprefix('sha256:')
          values['XRAY_SHA256'] = defaults['xray_checksums'][values['XRAY_VERSION']]['amd64'].removeprefix('sha256:')
          for key, value in values.items():
              print(f'{key}={shlex.quote(value)}')
          PY
          )"
          curl -fsSL --retry 5 -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          echo "${SINGBOX_SHA256}  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 0755 "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          curl -fsSL --retry 5 -o /tmp/sing-box-legacy.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_LEGACY_VERSION}/sing-box-${SINGBOX_LEGACY_VERSION}-linux-amd64.tar.gz"
          echo "${SINGBOX_LEGACY_SHA256}  /tmp/sing-box-legacy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box-legacy.tar.gz -C /tmp
          curl -fsSL --retry 5 -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-${XRAY_ASSET}.zip"
          echo "${XRAY_SHA256}  /tmp/xray.zip" | sha256sum -c -
          mkdir -p "/tmp/xray-${XRAY_VERSION}"
          unzip -q /tmp/xray.zip -d "/tmp/xray-${XRAY_VERSION}"
          {
            echo "SINGBOX_TEST_BIN=/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box"
            echo "SINGBOX_LEGACY_TEST_BIN=/tmp/sing-box-${SINGBOX_LEGACY_VERSION}-linux-amd64/sing-box"
            echo "XRAY_TEST_BIN=/tmp/xray-${XRAY_VERSION}/xray"
          } >> "$GITHUB_ENV"
      - name: Render configs
        run: ansible-playbook -i localhost, tests/render-singbox-config.yml
      - name: Python tests
        env:
          CI: 'true'
        run: python -m pytest -q tests
      - name: Scan secrets
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL --retry 5 -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1
      - name: Scan coordinates
        run: scripts/scan-coordinates.sh
