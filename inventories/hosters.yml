---
# Каталог хостеров. ПУБЛИЧНЫЙ файл: здесь только дефолты первого входа и
# заметки, ни одной координаты и ни одного секрета.
#
# Зачем он есть. Дверь свежей ноды у каждого провайдера своя, и знание это
# внешнее — его неоткуда вывести из кода. Каталог хранит его один раз, а не
# в голове того, кто заводил прошлую ноду.
#
# Поля профиля:
#   title         человеческое имя;
#   provisioning  panel     — ноду создаёшь руками в панели провайдера;
#                 terraform — ноду создаёт make provision (terraform/);
#   first_entry   дефолты для записи в карте первого входа: под кем, по какому
#                 порту и чем открывается дверь. Это ДЕФОЛТЫ: визард даёт
#                 переопределить любое поле, потому что образ или шаблон ноды
#                 может отдать её иначе;
#   notes         то, что стоит знать до первого входа.
#
# Профиль добавляется командой wizard/hoster.py --add, но руками дописать сюда
# ничем не хуже: формат ровно такой, как видно.
hosters:
  ovh:
    title: OVH
    provisioning: panel
    first_entry:
      user: root
      port: 22
      method: password
    notes:
      - "пароль приходит письмом и обычно выдан просроченным: PAM потребует
         сменить его при первом входе — make first-contact ведёт этот диалог сам"
      - "пользователь зависит от шаблона: часть образов отдаёт root, часть —
         ubuntu; после переустановки сверься с письмом"
      - "в панели есть аварийная KVM-консоль: запасная дверь, если сеть отвалится"

  hosthatch:
    title: HostHatch
    provisioning: panel
    first_entry:
      user: root
      port: 22
      method: password
    notes:
      - "дефолты этой установкой не проверялись: сверь с письмом провайдера при
         первом заведении и поправь профиль, если разошлось"

  hetzner:
    title: Hetzner Cloud
    provisioning: terraform
    first_entry:
      user: root
      port: 22
      method: key
    notes:
      - "нода создаётся не в панели, а терраформом: make provision, нужен
         HCLOUD_TOKEN в окружении"
      - "публичный ключ кладётся при создании (terraform/terraform.tfvars,
         переменная ssh_public_key), поэтому пароля нет вовсе — method: key"
      - "IP берётся из вывода terraform: output ipv4"
