---
# Единый mapping per-node SOPS variables для server role и client export.
- name: Смапить per-node секреты из SOPS
  ansible.builtin.set_fact:
    node_clients: >-
      {{ ansible_facts[_clients_var] if _clients_var in ansible_facts else
         lookup('vars', _clients_var, default=[]) }}
    node_reality_private_key: >-
      {{ ansible_facts[_private_key_var] if _private_key_var in ansible_facts else
         lookup('vars', _private_key_var, default='') }}
    node_reality_public_key: >-
      {{ ansible_facts[_public_key_var] if _public_key_var in ansible_facts else
         lookup('vars', _public_key_var, default='') }}
    node_reality_short_id: >-
      {{ ansible_facts[_short_id_var] if _short_id_var in ansible_facts else
         lookup('vars', _short_id_var, default='') }}
    node_hy2_password: >-
      {{ ansible_facts[_hy2_password_var]
         if _hy2_password_var in ansible_facts else
         lookup('vars', _hy2_password_var, default='') }}
    node_hy2_certificate: >-
      {{ ansible_facts[_hy2_certificate_var]
         if _hy2_certificate_var in ansible_facts else
         lookup('vars', _hy2_certificate_var, default='') }}
    node_hy2_key: >-
      {{ ansible_facts[_hy2_key_var]
         if _hy2_key_var in ansible_facts else
         lookup('vars', _hy2_key_var, default='') }}
    node_hy2_certificate_public_key_sha256: >-
      {{ ansible_facts[_hy2_pin_var]
         if _hy2_pin_var in ansible_facts else
         lookup('vars', _hy2_pin_var, default='') }}
    node_wg: >-
      {{ ansible_facts[_wg_var] if _wg_var in ansible_facts else
         lookup('vars', _wg_var, default={}) }}
  vars:
    _secret_prefix: "node_{{ node_name | replace('-', '_') }}"
    _clients_var: "{{ _secret_prefix }}_clients"
    _private_key_var: "{{ _secret_prefix }}_reality_private_key"
    _public_key_var: "{{ _secret_prefix }}_reality_public_key"
    _short_id_var: "{{ _secret_prefix }}_reality_short_id"
    _hy2_password_var: "{{ _secret_prefix }}_hy2_password"
    _hy2_certificate_var: "{{ _secret_prefix }}_hy2_certificate"
    _hy2_key_var: "{{ _secret_prefix }}_hy2_key"
    _hy2_pin_var: "{{ _secret_prefix }}_hy2_certificate_public_key_sha256"
    _wg_var: "{{ _secret_prefix }}_wg"
  no_log: true

- name: Assert inventory and SOPS declare the same clients
  ansible.builtin.assert:
    that:
      - singbox_client_names is defined
      - >-
        (singbox_client_names | default([]) | difference(node_clients | map(attribute='name') | list) | length) == 0
      - >-
        (node_clients | map(attribute='name') | list | difference(singbox_client_names | default([])) | length) == 0
    fail_msg: >-
      {{ inventory_hostname }}: client names differ (inventory only:
      {{ singbox_client_names | default([]) | difference(node_clients | map(attribute='name') | list) | join(', ') }};
      SOPS only: {{ node_clients | map(attribute='name') | list | difference(singbox_client_names | default([])) | join(', ') }};
      declaration: {{ 'present' if singbox_client_names is defined else 'missing singbox_client_names' }})
    quiet: true
