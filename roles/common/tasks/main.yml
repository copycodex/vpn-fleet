---
# Common role: baseline configuration applied to ALL managed hosts.

# ─── Timezone & locale ────────────────────────────────────────────────────────

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure locale is generated
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present

# ─── apt cache & upgrade ──────────────────────────────────────────────────────

- name: Update apt cache (max 1h old)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# ─── Base packages ────────────────────────────────────────────────────────────

- name: Install base utility packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Remove unwanted default packages
  ansible.builtin.apt:
    name: "{{ common_packages_remove }}"
    state: absent
    purge: true
    autoremove: true

# ─── System limits ────────────────────────────────────────────────────────────

- name: Configure system limits
  ansible.builtin.template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/99-managed.conf
    owner: root
    group: root
    mode: "0644"

# ─── Unattended upgrades (controlled) ─────────────────────────────────────────

- name: Install unattended-upgrades package (controlled mode)
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: common_enable_unattended_upgrades

- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: common_enable_unattended_upgrades
  notify: Restart unattended-upgrades

- name: Configure apt periodic schedule
  ansible.builtin.template:
    src: auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: common_enable_unattended_upgrades
