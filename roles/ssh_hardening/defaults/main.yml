---
# SSH hardening role defaults — based on Mozilla OpenSSH guidelines.

ssh_port: 2424
ssh_address_family: any  # any | inet | inet6

# Allowed users (will be substituted into AllowUsers directive)
ssh_allowed_users:
  - devops

# Strong ciphers only — disable CBC modes
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr

# Modern key exchange algorithms only
ssh_kex_algorithms:
  - curve25519-sha256@libssh.org
  - ecdh-sha2-nistp521
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp256
  - diffie-hellman-group-exchange-sha256

# Strong MACs only
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com

# Modern host key algorithms
ssh_host_key_algorithms:
  - ssh-ed25519
  - ssh-ed25519-cert-v01@openssh.com
  - rsa-sha2-512
  - rsa-sha2-256

# Behavioural
ssh_login_grace_time: 30
ssh_max_auth_tries: 3
ssh_max_sessions: 10
ssh_max_startups: "10:30:60"
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2

# Forwarding
ssh_x11_forwarding: false
ssh_allow_tcp_forwarding: true
ssh_allow_agent_forwarding: false

# Banner
ssh_banner_enabled: false
ssh_banner_text: "Authorized access only. All activity is monitored."
